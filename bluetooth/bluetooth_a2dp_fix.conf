# Bluetooth A2DP Fix for JK601 A13
# Issue: Audio connects but does not reach headset
# AVDTP stack fails to initiate after SDP+pairing
# Properties to force A2DP profile activation and reduce timeouts

# Reduce AVDTP wait timeout
ro.bluetooth.avdtp.wait.timeout=30000

# Enable A2DP fallback mode
ro.bluetooth.a2dp.fallback=true

# Increase AVDTP transaction timeout
ro.bluetooth.a2dp.transaction.timeout=5000

# Enable A2DP start after SDP pairing
ro.bluetooth.a2dp.start.after.sdp=true